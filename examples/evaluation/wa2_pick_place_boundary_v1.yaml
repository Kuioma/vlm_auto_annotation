version: 1
profile_id: wa2-pick-place-boundary-v1

inputs:
  gold_set_path: ../../../dataset/WA2_industrial_sorting_3cam_gripper_cam/0622_333_20260624_093035_converted_online_clean_20260624_194551/meta/human_subtask_annotation/wa2_0622_pick_place_v1/gold_set.json
  annotations_dir: ../../../dataset/WA2_industrial_sorting_3cam_gripper_cam/0622_333_20260624_093035_converted_online_clean_20260624_194551/meta/human_subtask_annotation/wa2_0622_pick_place_v1/annotations
  prediction_path: ../../../dataset/WA2_industrial_sorting_3cam_gripper_cam/0622_333_20260624_093035_converted_online_clean_20260624_194551/meta/auto_annotation_pick_and_place_bolt_batch/run-3523451324d0d8ad9c2fede4bb14c359862a50f030ff5d60552927bac1ce4d26/output.jsonl

evaluation_mode: official

eligibility:
  require_complete_gold_set: true
  included_statuses: [complete]
  missing_gold_annotation: fail
  missing_prediction: count_as_missing
  extra_prediction: ignore_and_report
  duplicate_video_id: fail
  duration_mismatch: fail

metrics:
  boundary_error:
    enabled: true
    metric_version: boundary-error-v1
    event_ids: [transfer, place]
    thresholds_ms: [500, 1000, 2000]
    report: [mae, signed_bias, hit_rate, per_event]

  temporal_iou:
    enabled: true
    metric_version: temporal-iou-v1
    matching: segment_id
    thresholds: [0.3, 0.5, 0.7]
    report: [mean, per_segment, precision, recall, f1]

  sequence_edit_distance:
    enabled: false
    metric_version: sequence-edit-distance-v1
    field: atomic_action
    reason: fixed_ordered_task_plan

  label_accuracy:
    enabled: false
    metric_version: label-accuracy-v1
    fields: [atomic_action, interaction_object]
    exact_match_groups:
      - [atomic_action, interaction_object]
    reason: values_fixed_by_task_plan

  segmentation_errors:
    enabled: false
    metric_version: segmentation-errors-v1
    substantial_overlap_threshold: 0.5
    report:
      - over_split_count
      - missed_segment_count
      - incorrect_merge_count
      - extra_segment_count
    reason: segment_structure_fixed_by_task_plan

  semantic_quality:
    enabled: false
    implementation: deferred
    reason: semantic evaluator is intentionally deferred

  gold_reliability:
    enabled: false
    implementation: deferred
    reason: repeated independent Gold annotations are not yet available

aggregation:
  primary: macro_episode
  also_report: [micro, per_event, per_segment]
  percentiles: [50, 90]
  report_max: true

missing_predictions:
  report_coverage: true
  boundary_mae: exclude_with_count
  boundary_hit_rate: count_as_miss

uncertainty:
  enabled: true
  method: episode_bootstrap
  confidence_level: 0.95
  resamples: 10000
  seed: 20260721

decision:
  mode: report_only
  composite_score: null
  thresholds: null

review_queue:
  enabled: true
  top_k: 20
  order_by: [missing_prediction, max_boundary_error_ms, mean_tiou_ascending]

output:
  root: /tmp/wa2-evaluation
  write_summary_json: true
  write_episodes_jsonl: true
  write_failures_jsonl: true
  write_review_queue_jsonl: true
  write_markdown_report: true
